name: PR check — build & scan only

on:
  pull_request:
    branches:
      - main
    paths:
      - 'services/**'
      - '.github/workflows/**'

jobs:
  pr-build-scan:
    name: PR check — ${{ matrix.service }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        service:
          - user
          - product
          - order
          - notification
          - analytics

    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5

        with:
          context: ./services/${{ matrix.service }}-service
          target: final

          push: false
          load: true

          tags: localbuild/${{ matrix.service }}:pr

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master

        with:
          image-ref: localbuild/${{ matrix.service }}:pr

          format: sarif
          output: trivy-${{ matrix.service }}.sarif

          severity: CRITICAL,HIGH

          exit-code: 0

      - name: Upload SARIF results
        if: always()

        uses: github/codeql-action/upload-sarif@v3

        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Fail if CRITICAL vulnerabilities exist
        uses: aquasecurity/trivy-action@master

        with:
          image-ref: localbuild/${{ matrix.service }}:pr

          format: table
          severity: CRITICAL

          exit-code: 1
