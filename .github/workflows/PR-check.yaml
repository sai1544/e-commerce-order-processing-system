name: PR check — build & scan only

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/**'           # only trigger if service code changed
      - '.github/workflows/**'  # or if the workflow itself changed

jobs:
  pr-build-scan:
    name: PR check — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user, product, order, notification, analytics]

    permissions:
      contents: read
      security-events: write
      pull-requests: write       # allows commenting scan summary on PR

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}-service
          target: final
          push: false
          load: true
          tags: shopstream-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: shopstream-${{ matrix.service }}:pr-${{ github.event.pull_request.number }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: CRITICAL,HIGH
          exit-code: 1

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
