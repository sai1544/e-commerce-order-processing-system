name: CI — build, scan, push

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - '.github/workflows/**'

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/shopstream

jobs:

  changes:
    runs-on: ubuntu-latest

    outputs:
      user: ${{ steps.filter.outputs.user }}
      product: ${{ steps.filter.outputs.product }}
      order: ${{ steps.filter.outputs.order }}
      notification: ${{ steps.filter.outputs.notification }}
      analytics: ${{ steps.filter.outputs.analytics }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect changed services
        id: filter
        uses: dorny/paths-filter@v3

        with:
          filters: |
            user:
              - 'services/user-service/**'

            product:
              - 'services/product-service/**'

            order:
              - 'services/order-service/**'

            notification:
              - 'services/notification-service/**'

            analytics:
              - 'services/analytics-service/**'

  build-scan-push:
    name: Build — ${{ matrix.service }}

    needs: changes

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        include:
          - service: user
            changed: ${{ needs.changes.outputs.user }}

          - service: product
            changed: ${{ needs.changes.outputs.product }}

          - service: order
            changed: ${{ needs.changes.outputs.order }}

          - service: notification
            changed: ${{ needs.changes.outputs.notification }}

          - service: analytics
            changed: ${{ needs.changes.outputs.analytics }}

    if: matrix.changed == 'true'

    permissions:
      contents: read
      security-events: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        if: github.ref == 'refs/heads/main'

        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta

        uses: docker/metadata-action@v5

        with:
          images: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}

          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@v5

        with:
          context: ./services/${{ matrix.service }}-service
          target: final

          push: false
          load: true

          tags: localbuild/${{ matrix.service }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master

        with:
          image-ref: localbuild/${{ matrix.service }}:latest

          format: sarif
          output: trivy-${{ matrix.service }}.sarif

          severity: CRITICAL,HIGH

          exit-code: 0

      - name: Upload Trivy results
        if: always()

        uses: github/codeql-action/upload-sarif@v3

        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Fail if CRITICAL CVEs found
        uses: aquasecurity/trivy-action@master

        with:
          image-ref: localbuild/${{ matrix.service }}:latest

          format: table
          severity: CRITICAL

          exit-code: 1

      - name: Push image to DockerHub
        if: github.ref == 'refs/heads/main'

        uses: docker/build-push-action@v5

        with:
          context: ./services/${{ matrix.service }}-service
          target: final

          push: true

          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
